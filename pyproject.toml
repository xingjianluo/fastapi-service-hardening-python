[project]
name = "fastapi-service-hardening-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
